[package]
name = "expm_rust"
version = "0.2.0"
edition = "2024"
description = "Generic Padé approximation with scaling and squaring for matrix exponential computation"
documentation = "https://docs.rs/expm_rust"
readme = "README.md"
homepage = "https://github.com/fsadannn/expm_rust"
repository = "https://github.com/fsadannn/expm_rust"
license = "BSD-3-Clause OR Apache-2.0"
keywords = ["linear-algebra", "matrix-exponential", "numerics", "pade", "scipy"]
categories = ["algorithms", "mathematics", "science"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "./docs-header.html"]

[dependencies]
nalgebra = { version = "0.35.0", optional = true, features = ["compare"] }
oxiblas = { version = "0.2", optional = true }

[features]
default = ["oxiblas-backend","nalgebra-backend"]
oxiblas-backend = ["dep:oxiblas"]
nalgebra-backend = ["dep:nalgebra"]

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.test]
debug = "line-tables-only"
